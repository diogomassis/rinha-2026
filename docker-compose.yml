services:
  haproxy:
    image: haproxy:2.8-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - rinha-2026-1
      - rinha-2026-2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"

  rinha-2026-1:
    image: ghcr.io/diogomassis/rinha-2026:latest
    platform: linux/amd64
    command: uvicorn app.main:app --host 0.0.0.0 --port 80 --loop uvloop --http httptools --no-access-log
    environment:
      WARMUP_INDEX: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/ready').status == 200 else 1)\""]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      default:
        aliases:
          - rinha-2026-1

  rinha-2026-2:
    image: ghcr.io/diogomassis/rinha-2026:latest
    platform: linux/amd64
    command: uvicorn app.main:app --host 0.0.0.0 --port 80 --loop uvloop --http httptools --no-access-log
    environment:
      WARMUP_INDEX: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1/ready').status == 200 else 1)\""]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      default:
        aliases:
          - rinha-2026-2

networks:
  default:
    driver: bridge
